name: Bilety Malaga - Barcelona
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
concurrency:
  group: malaga-ticket-watch
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check tickets and notify
        run: python monitor.py
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-status
          path: report.json
          if-no-files-found: ignore
          retention-days: 7
